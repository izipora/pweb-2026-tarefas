{% extends 'base.html' %}

{% block content %}

<h2>Postagens</h2>

<ul>
{% for post in posts %}
    <li>
        <h3>{{ post.titulo }}</h3>
        <p>{{ post.data_publicacao }}</p>
        <a href="/post/{{ post.id }}/">
            Ler postagem
        </a>
    </li>
{% endfor %}
</ul>

{% endblock %}
