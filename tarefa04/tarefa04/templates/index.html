<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Lista de Missões</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #000e20;
    }

    h1 {
        text-align: center;
        color:white
    }

    ul {
        list-style: none;
        padding: 0;
    }

    li {
        background: white;
        padding: 10px;
        margin-bottom: 8px;
        border: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .concluida {
        color: green;
        font-weight: bold;
    }

    .pendente {
        color: orange;
        font-weight: bold;
    }

  

</style>
</head>

<body>

<h1>Lista de Missões</h1>

<ul>

{% for missao in missoes %}

    <li>

        <div>
            <strong>{{ missao.nome }}</strong><br>

            {% if missao.prazo < hoje and not missao.status %}
                <span class="fracassada">{{ missao.prazo }} </span>
            {% else %}
                {{ missao.prazo }}
            {% endif %}
        </div>

        <div>
            {% if missao.status %}
                <span class="concluida">Concluída</span>
            {% else %}
                <span class="pendente">Pendente</span>
            {% endif %}
        </div>

    </li>

{% endfor %}

</ul>

</body>
</html>
